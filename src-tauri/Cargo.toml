[package]
name = "on-start-up"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI shell for the on-start-up background service"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
on-start-up-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Embedded-frontend (standalone) mode. Enabled by `cargo xtask build` and by
# `tauri build`. NOT enabled under `bun run tauri dev`, which loads the
# frontend from the dev server for hot reload.
custom-protocol = ["tauri/custom-protocol"]
